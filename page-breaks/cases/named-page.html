<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Named page</title>
  <style>
    /* The same base in every test document: A5 pages and 20px lines,
       so that each engine puts the page break at the same place. */
    @page { size: A5; margin: 15mm; }
    html { font: 14px/20px "Liberation Sans", Arial, sans-serif; color: #1f2933; }
    body { margin: 0; }
    h2 { font-size: 18px; line-height: 24px; margin: 0 0 8px; }
    p { margin: 0 0 10px; }
    .spacer { background: #e4e7eb; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 4px 6px; border: 1px solid #9aa5b1; text-align: left; vertical-align: top; }
  </style>
</head>
<body>
  <!-- The wide section must print on a landscape page. -->
  <p>INTRO1 The wide table follows on its own page.</p>
  <section class="wide">
    <p>WIDE1 Incidents per month and service</p>
    <table>
      <thead><tr><th>Service</th><th>Jan</th><th>Feb</th><th>Mar</th><th>Apr</th><th>May</th><th>Jun</th><th>Jul</th><th>Aug</th><th>Sep</th><th>Oct</th><th>Nov</th><th>Dec</th></tr></thead>
      <tbody>
        <tr><th>API</th><td>0</td><td>3</td><td>6</td><td>0</td><td>3</td><td>6</td><td>0</td><td>3</td><td>6</td><td>0</td><td>3</td><td>6</td></tr>
        <tr><th>Web</th><td>7</td><td>1</td><td>4</td><td>7</td><td>1</td><td>4</td><td>7</td><td>1</td><td>4</td><td>7</td><td>1</td><td>4</td></tr>
        <tr><th>Jobs</th><td>5</td><td>8</td><td>2</td><td>5</td><td>8</td><td>2</td><td>5</td><td>8</td><td>2</td><td>5</td><td>8</td><td>2</td></tr>
        <tr><th>Mail</th><td>3</td><td>6</td><td>0</td><td>3</td><td>6</td><td>0</td><td>3</td><td>6</td><td>0</td><td>3</td><td>6</td><td>0</td></tr>
      </tbody>
    </table>
  </section>
  <p>OUTRO1 The text after the wide section.</p>
</body>
</html>
